<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALERT2 Decoder</title>
<style>
  :root {
    --bg: #f5f5f4;
    --panel: #ffffff;
    --border: #d6d3d1;
    --text: #1c1917;
    --text-dim: #57534e;
    --text-faint: #a8a29e;
    --accent: #0369a1;
    --accent-bg: #e0f2fe;
    --good: #15803d;
    --warn: #b45309;
    --bad: #b91c1c;
    --row-hover: #f5f5f4;
    --row-selected: #e0f2fe;
    --row-flash: #fef3c7;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.4;
  }
  .mono {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }

  /* Header */
  header {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 8px 16px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  header h1 {
    margin: 0;
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
  }
  .status-strip {
    display: flex;
    gap: 16px;
    color: var(--text-dim);
    font-size: 13px;
    flex: 1;
  }
  .status-strip .label { color: var(--text-faint); margin-right: 4px; }
  .status-strip .value { color: var(--text); font-weight: 500; }

  .actions { display: flex; gap: 8px; }
  .btn {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 13px;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
  }
  .btn:hover { background: var(--row-hover); }
  .btn-primary { background: var(--accent); color: white; border-color: var(--accent); }
  .btn-primary:hover { background: #075985; }

  /* Main layout */
  main {
    display: flex;
    height: calc(100vh - 50px);
    overflow: hidden;
  }
  @media (max-width: 768px) {
    main {
      flex-direction: column;
      height: auto;
    }
    .packet-list { max-height: 50vh; }
  }
  .packet-list {
    flex: 0 0 380px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }
  .filter-bar {
    padding: 8px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .filter-bar input {
    width: 100%;
    padding: 6px 8px;
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 13px;
  }
  .filter-bar input:focus {
    outline: none;
    border-color: var(--accent);
  }
  .filter-help { font-size: 11px; color: var(--text-faint); margin-top: 4px; }
  .filter-checkbox-label {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 6px;
    cursor: pointer;
    user-select: none;
  }
  .filter-checkbox-label input { margin: 0; cursor: pointer; }

  table.packets {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  table.packets th {
    text-align: left;
    padding: 6px 8px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    color: var(--text-dim);
    font-weight: 500;
    font-size: 12px;
    position: sticky;
    top: 0;
  }
  table.packets td {
    padding: 6px 8px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  table.packets tr {
    cursor: pointer;
  }
  table.packets tr:hover td { background: var(--row-hover); }
  table.packets tr.selected td { background: var(--row-selected); }
  table.packets tr.flash td { animation: flash 1.5s ease-out; }
  @keyframes flash {
    0% { background: var(--row-flash); }
    100% { background: transparent; }
  }
  .row-time { color: var(--text-dim); font-size: 12px; }
  .row-src { font-weight: 600; }
  .row-src a { color: var(--accent); text-decoration: none; }
  .row-src a:hover { text-decoration: underline; }
  .row-meta { color: var(--text-faint); font-size: 11px; }
  .badge {
    display: inline-block;
    padding: 1px 5px;
    border-radius: 3px;
    font-size: 11px;
    font-weight: 500;
    margin-left: 4px;
  }
  .badge-trunc { background: #fee2e2; color: var(--bad); }
  .badge-rs { background: #fef3c7; color: var(--warn); }
  .badge-clean { background: #dcfce7; color: var(--good); }

  /* Detail panel */
  .detail {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
  }
  .detail .empty {
    color: var(--text-faint);
    text-align: center;
    padding: 60px 20px;
    font-style: italic;
  }
  .detail h2 {
    margin: 0 0 12px 0;
    font-size: 18px;
    color: var(--text);
  }
  .detail-grid {
    display: grid;
    grid-template-columns: 160px 1fr;
    gap: 6px 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px 16px;
    margin-bottom: 16px;
  }
  .detail-grid .label {
    color: var(--text-dim);
    font-size: 13px;
  }
  .detail-grid .value {
    color: var(--text);
    font-size: 13px;
  }
  .detail-grid .value.mono { font-family: ui-monospace, monospace; }

  .sensors-table {
    width: 100%;
    border-collapse: collapse;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    font-size: 13px;
    margin-top: 12px;
  }
  .sensors-table th {
    background: #fafaf9;
    padding: 8px 12px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    color: var(--text-dim);
    font-weight: 500;
    font-size: 12px;
  }
  .sensors-table td {
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
  }
  .sensors-table tr:last-child td { border-bottom: none; }
  .sensor-name { color: var(--accent); font-weight: 500; }
  .sensor-id { color: var(--text-faint); font-size: 11px; margin-left: 4px; }

  .bundled-note {
    background: #eff6ff;
    border: 1px solid #bfdbfe;
    border-radius: 6px;
    padding: 8px 12px;
    margin: 10px 0;
    font-size: 12px;
    line-height: 1.5;
    color: #1e40af;
  }

  .panel-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-dim);
    margin: 16px 0 8px 0;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  /* Footer/stats strip */
  footer {
    background: var(--panel);
    border-top: 1px solid var(--border);
    padding: 6px 16px;
    font-size: 12px;
    color: var(--text-dim);
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  footer .stat { white-space: nowrap; }
  footer .stat .label { color: var(--text-faint); margin-right: 4px; }
  footer .stat .value { color: var(--text); font-weight: 500; }

  .pause-banner {
    background: var(--accent-bg);
    color: var(--accent);
    padding: 6px 12px;
    font-size: 12px;
    text-align: center;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }
  .pause-banner:hover { background: #bae6fd; }
  .pause-banner.hidden { display: none; }
</style>
</head>
<body>
<header>
  <h1>ALERT2 Decoder</h1>
  <div class="status-strip">
    <span class="stat"><span class="label">uptime</span><span class="value" id="uptime">—</span></span>
    <span class="stat"><span class="label">packets</span><span class="value" id="pkt-count">—</span></span>
    <span class="stat"><span class="label">avg SNR</span><span class="value" id="avg-snr">—</span></span>
    <span class="stat"><span class="label">sources</span><span class="value" id="src-count">—</span></span>
  </div>
  <div class="actions">
    <a class="btn" href="/export/csv">Download CSV</a>
  </div>
</header>

<main>
  <div class="packet-list" id="packet-list-container">
    <div class="filter-bar">
      <input type="text" id="filter" placeholder="Filter: src=769, rs>0, hd&gt;1, truncated"
             autocomplete="off">
      <label class="filter-checkbox-label">
        <input type="checkbox" id="hide-redundant-truncated">
        Hide truncated when full version exists
      </label>
      <div class="filter-help">Click a row to see full details.</div>
    </div>
    <div class="pause-banner hidden" id="pause-banner">
      Auto-scroll paused. Click to resume.
    </div>
    <table class="packets">
      <thead>
        <tr><th>Time</th><th>Source</th><th>Sensor data</th></tr>
      </thead>
      <tbody id="packet-rows"></tbody>
    </table>
  </div>

  <div class="detail" id="detail-panel">
    <div class="empty">Click a packet on the left to see details.</div>
  </div>
</main>

<footer>
  <span class="stat"><span class="label">RS clean</span><span class="value" id="ft-rs-clean">—</span></span>
  <span class="stat"><span class="label">FS_hd 0</span><span class="value" id="ft-fs0">—</span></span>
  <span class="stat"><span class="label">truncated</span><span class="value" id="ft-trunc">—</span></span>
  <span class="stat"><span class="label">SNR range</span><span class="value" id="ft-snr-range">—</span></span>
  <span class="stat" style="margin-left:auto;"><span class="label">refresh every</span><span class="value" id="ft-refresh">—</span></span>
</footer>

<script>
(function() {
  const POLL_INTERVAL = __POLL_INTERVAL__;
  let lastSeq = 0;
  let allPackets = [];          // most-recent first
  let selectedSeq = null;
  let autoScrollPaused = false;

  document.getElementById('ft-refresh').textContent = (POLL_INTERVAL/1000) + 's';

  // Helpers
  function fmt(v, d) { return v == null ? d : v; }
  function fmtSnr(v) { return v == null ? '—' : v.toFixed(1) + ' dB'; }
  // MER is shown alongside SNR, not instead of it. SNR is an FM-quieting
  // level ratio (capture-gain dependent, so not comparable between sites);
  // MER is amplitude-normalised modulation quality, so it is. A dash means
  // no honest reference existed — never a fallback estimate.
  function fmtMer(v) { return v == null ? '—' : v.toFixed(1) + ' dB'; }
  function fmtTime(iso) {
    if (!iso) return '';
    const t = new Date(iso);
    return t.toTimeString().slice(0, 8) + '.' +
           String(t.getMilliseconds()).padStart(3, '0');
  }
  function summarizeSensors(p) {
    if (p.srp_summary) return p.srp_summary
      .replace(/^SRP(\[[^\]]+\])*:\s*/, '');
    if (p.app_payload_hex) return '<' + p.app_payload_hex.slice(0, 24) + '...>';
    return '';
  }
  function pathStr(p) {
    if (!p.path || p.path.length === 0) return 'direct';
    return p.path.join(' → ');
  }

  // Render packet list
  function renderRows() {
    const filter = parseFilter(document.getElementById('filter').value);
    const hideRedundant = document.getElementById('hide-redundant-truncated').checked;
    const tbody = document.getElementById('packet-rows');
    let rows = allPackets.filter(filter);

    // If "hide truncated when full version exists" is checked,
    // build a set of (src, srp_ts) pairs that have a non-truncated decode,
    // then drop any truncated row that matches one of those pairs.
    if (hideRedundant) {
      const cleanPairs = new Set();
      for (const p of allPackets) {
        if (!p.truncated && p.src != null && p.srp_ts != null) {
          cleanPairs.add(p.src + ':' + p.srp_ts);
        }
      }
      rows = rows.filter(p => {
        if (!p.truncated) return true;
        if (p.src == null || p.srp_ts == null) return true;
        return !cleanPairs.has(p.src + ':' + p.srp_ts);
      });
    }
    tbody.innerHTML = rows.map(p => {
      const sel = p.seq === selectedSeq ? ' selected' : '';
      const trunc = p.truncated ? '<span class="badge badge-trunc">TRUNC</span>' : '';
      const rs = p.rs_corrections > 0
                  ? '<span class="badge badge-rs">RS=' + p.rs_corrections + '</span>'
                  : '';
      return `<tr class="row${sel}" data-seq="${p.seq}">
        <td><span class="row-time mono">${fmtTime(p.rx_time_iso)}</span></td>
        <td><span class="row-src"><a href="/source/${p.src}" onclick="event.stopPropagation()">${fmt(p.src,'?')}</a></span>${trunc}${rs}<br>
            <span class="row-meta">${pathStr(p)} · SNR ${fmtSnr(p.snr_db)} · MER ${fmtMer(p.mer_db)}${
              p.mer_eq_db == null ? '' : ' / ' + p.mer_eq_db.toFixed(1) + ' eq'} · hd=${fmt(p.framesync_hd,'?')}</span></td>
        <td>${escapeHtml(summarizeSensors(p))}</td>
      </tr>`;
    }).join('');
    // Bind click handlers
    tbody.querySelectorAll('tr').forEach(tr => {
      tr.addEventListener('click', () => {
        selectedSeq = parseInt(tr.dataset.seq);
        renderRows();
        renderDetail();
      });
    });
  }

  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function parseFilter(text) {
    text = (text || '').trim();
    if (!text) return () => true;
    // Split on whitespace; each token is a filter
    const tokens = text.split(/\s+/);
    return (p) => tokens.every(tok => evalToken(tok, p));
  }
  function evalToken(tok, p) {
    if (tok.toLowerCase() === 'truncated') return !!p.truncated;
    const m = tok.match(/^(\w+)\s*([<>=]+)\s*(.+)$/);
    if (!m) return true;
    const [, key, op, valStr] = m;
    let actual;
    switch (key.toLowerCase()) {
      case 'src': actual = p.src; break;
      case 'rs': case 'rs_corr': case 'rs_corrections': actual = p.rs_corrections || 0; break;
      case 'hd': case 'fs_hd': case 'framesync_hd': actual = p.framesync_hd; break;
      case 'snr': case 'snr_db': actual = p.snr_db; break;
      case 'mer': case 'mer_db': actual = p.mer_db; break;
      case 'mer_eq': case 'mer_eq_db': actual = p.mer_eq_db; break;
      case 'eq_gain': actual = p.mer_eq_gain_db; break;
      case 'alpha': case 'level': actual = p.mer_alpha; break;
      case 'evm': actual = p.mer_evm_pct; break;
      case 'pdu_id': case 'id': actual = p.app_pdu_id; break;
      case 'len': actual = p.mant_payload_length; break;
      default: return true;
    }
    const val = isNaN(+valStr) ? valStr : +valStr;
    if (actual == null) return false;
    switch (op) {
      case '=': case '==': return actual == val;
      case '!=': return actual != val;
      case '>': return actual > val;
      case '<': return actual < val;
      case '>=': return actual >= val;
      case '<=': return actual <= val;
    }
    return true;
  }

  // Render detail
  function renderDetail() {
    const panel = document.getElementById('detail-panel');
    const p = allPackets.find(x => x.seq === selectedSeq);
    if (!p) {
      panel.innerHTML = '<div class="empty">Click a packet on the left to see details.</div>';
      return;
    }
    let sensorRows = '';
    if (p.sensors && p.sensors.length) {
      sensorRows = `
        <div class="panel-title">Sensor readings</div>
        <table class="sensors-table">
          <thead><tr><th>Sensor</th><th>Description</th><th>Value</th></tr></thead>
          <tbody>` +
          p.sensors.map(s => `
            <tr><td class="mono">${s.sensor_id}</td>
                <td>${s.sensor_name ? '<span class="sensor-name">' + escapeHtml(s.sensor_name) + '</span>' : '<span class="row-meta">(admin)</span>'}</td>
                <td class="mono">${escapeHtml(String(s.value))}</td></tr>`).join('') +
          `</tbody></table>`;
    }
    let reportsList = '';
    if (p.reports && p.reports.length > 0) {
      const nonGsr = p.reports.filter(r => r.type !== 'GeneralSensorReport' || !p.sensors.length);
      if (nonGsr.length > 0 && nonGsr.length === p.reports.length && p.sensors.length === 0) {
        reportsList = `
          <div class="panel-title">Reports</div>
          <div class="detail-grid">` +
            p.reports.map(r => `<span class="label">${r.type}</span><span class="value">${escapeHtml(r.description)}</span>`).join('') +
          `</div>`;
      } else if (p.reports.some(r => r.type !== 'GeneralSensorReport')) {
        reportsList = `
          <div class="panel-title">Other reports</div>
          <div class="detail-grid">` +
            p.reports.filter(r => r.type !== 'GeneralSensorReport').map(r => `<span class="label">${r.type}</span><span class="value">${escapeHtml(r.description)}</span>`).join('') +
          `</div>`;
      }
    }
    let bundledNote = '';
    if (p.frame_pdu_count > 1 && p.frame_sources) {
      const others = p.frame_sources.filter((s, i) => i !== p.frame_index);
      const otherList = others.map(s => s == null ? '?' : s).join(', ');
      bundledNote = `
        <div class="bundled-note">
          Bundled transmission: this AirLink frame carried ${p.frame_pdu_count} PDUs.
          Other stations in the same transmission: <span class="mono">${escapeHtml(otherList)}</span>.
          The AirLink length below covers all ${p.frame_pdu_count} PDUs; the payload length above is this PDU only.
        </div>`;
    }
    panel.innerHTML = `
      <h2>Source ${p.src}${p.truncated ? ' <span class="badge badge-trunc">TRUNCATED</span>' : ''}</h2>
      <div class="panel-title">MANT header</div>
      <div class="detail-grid">
        <span class="label">Source</span><span class="value mono">${fmt(p.src,'?')}</span>
        <span class="label">Destination</span><span class="value mono">${fmt(p.dest,'—')}</span>
        <span class="label">Path</span><span class="value mono">${pathStr(p)}</span>
        <span class="label">Hop limit</span><span class="value mono">${fmt(p.hop,'?')}</span>
        <span class="label">Port</span><span class="value mono">${fmt(p.port,'?')}</span>
        <span class="label">Payload length</span><span class="value mono">${fmt(p.mant_payload_length,'?')} bytes</span>
        <span class="label">App PDU ID</span><span class="value mono">${p.app_pdu_id == null ? 'disabled' : p.app_pdu_id}</span>
        <span class="label">Test flag</span><span class="value mono">${p.app_test_flag ? 'yes' : 'no'}</span>
      </div>
      <div class="panel-title">RF / FEC</div>
      <div class="detail-grid">
        <span class="label">Received</span><span class="value mono">${fmtTime(p.rx_time_iso)}</span>
        <span class="label">SNR</span><span class="value mono">${fmtSnr(p.snr_db)}</span>
        <span class="label">MER</span><span class="value mono">${fmtMer(p.mer_db)}${
          p.mer_db != null && p.mer_evm_pct != null
            ? ' <span class="dim">(EVM ' + p.mer_evm_pct.toFixed(1) + '%, '
              + p.mer_symbols + ' sym, ' + (p.mer_coverage || '?') + ')</span>'
            : ''}</span>
        ${p.mer_eq_db == null ? '' :
          '<span class="label">MER after ideal eq</span><span class="value mono">'
          + p.mer_eq_db.toFixed(1) + ' dB'
          + (p.mer_eq_gain_db == null ? '' : ' <span class="dim">('
             + (p.mer_eq_gain_db >= 0 ? '+' : '')
             + p.mer_eq_gain_db.toFixed(1) + ' dB removable ISI)</span>')
          + '</span>'}
        ${p.mer_alpha == null ? '' :
          '<span class="label">Capture level</span><span class="value mono">'
          + p.mer_alpha.toFixed(4)
          + ' <span class="dim">(raw units — a step change means the input '
          + 'gain moved)</span></span>'}
        <span class="label">FS Hamming</span><span class="value mono">${fmt(p.framesync_hd,'?')}</span>
        <span class="label">RS corrections</span><span class="value mono">${p.rs_corrections}</span>
        <span class="label">FEC mode</span><span class="value mono">${p.fec_mode}</span>
        <span class="label">AirLink length</span><span class="value mono">${fmt(p.airlink_length, '?')} bytes</span>
        <span class="label">SRP timestamp</span><span class="value mono">${fmt(p.srp_ts,'—')}</span>
      </div>
      ${bundledNote}
      ${sensorRows}
      ${reportsList}
      <div class="panel-title">Raw payload</div>
      <div class="detail-grid">
        <span class="label">App payload</span><span class="value mono" style="word-break: break-all;">${fmt(p.app_payload_hex,'—')}</span>
      </div>
    `;
  }

  // Detect when user has scrolled away from top
  document.getElementById('packet-list-container').addEventListener('scroll', e => {
    const banner = document.getElementById('pause-banner');
    if (e.target.scrollTop > 30) {
      autoScrollPaused = true;
      banner.classList.remove('hidden');
    } else {
      autoScrollPaused = false;
      banner.classList.add('hidden');
    }
  });
  document.getElementById('pause-banner').addEventListener('click', () => {
    document.getElementById('packet-list-container').scrollTop = 0;
  });

  document.getElementById('filter').addEventListener('input', renderRows);
  document.getElementById('hide-redundant-truncated').addEventListener('change', renderRows);

  // Polling
  async function fetchPackets() {
    try {
      const resp = await fetch('/api/packets?since=' + lastSeq);
      const data = await resp.json();
      if (data.packets.length > 0) {
        // Newest packets are first; prepend
        allPackets = data.packets.concat(allPackets);
        // Cap at 1000 client-side
        if (allPackets.length > 1000) allPackets = allPackets.slice(0, 1000);
        lastSeq = data.highest_seq;
        const wasAtTop = !autoScrollPaused;
        renderRows();
        if (wasAtTop) {
          document.getElementById('packet-list-container').scrollTop = 0;
        }
        if (selectedSeq) renderDetail();
      }
    } catch (e) {
      // Network errors — silently retry next interval
    }
  }

  async function fetchStats() {
    try {
      const resp = await fetch('/api/stats');
      const s = await resp.json();
      // Header
      const u = s.decoder_uptime_sec || 0;
      const h = Math.floor(u / 3600), m = Math.floor((u % 3600) / 60);
      document.getElementById('uptime').textContent = h + 'h ' + m + 'm';
      document.getElementById('pkt-count').textContent = s.packets_decoded || '0';
      const snr = s.snr_summary_db;
      document.getElementById('avg-snr').textContent = snr ? snr.avg_db.toFixed(1) + ' dB' : '—';
      document.getElementById('src-count').textContent = s.unique_source_addresses || '0';
      // Footer
      const rsDist = s.rs_corrections_distribution || {};
      const rsClean = rsDist['0'] || 0;
      const total = s.packets_decoded || 1;
      document.getElementById('ft-rs-clean').textContent =
        rsClean + ' / ' + total + ' (' + Math.round(rsClean/total*100) + '%)';
      const hdDist = s.framesync_hd_distribution || {};
      const fs0 = hdDist['0'] || 0;
      document.getElementById('ft-fs0').textContent =
        fs0 + ' / ' + total + ' (' + Math.round(fs0/total*100) + '%)';
      document.getElementById('ft-trunc').textContent = (s.truncated_packets || 0);
      document.getElementById('ft-snr-range').textContent = snr
        ? snr.min_db.toFixed(1) + ' – ' + snr.max_db.toFixed(1) + ' dB' : '—';
    } catch (e) {}
  }

  fetchPackets();
  fetchStats();
  setInterval(fetchPackets, POLL_INTERVAL);
  setInterval(fetchStats, POLL_INTERVAL);
})();
</script>
</body>
</html>
